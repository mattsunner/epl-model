# Canonical club dimension. Hand-maintained, reviewed at the start of every season when
# promoted clubs enter (design.md section 5.3). One row per club that has ever appeared
# in the Premier League within the pipeline's backfill window (2015/16 onward), not just
# the current season's 20 -- a club relegated out of the FPL API's current roster still
# needs to resolve when it shows up in historical football-data.co.uk rows.
#
# football_data_name is the exact string used in football-data.co.uk's HomeTeam/AwayTeam
# columns. fpl_team_id is the numeric team ID from the FPL API's current bootstrap-static
# response -- null for any club not in the current top flight. clubelo_name,
# understat_name and transfermarkt_id are placeholders: null until those adapters exist.
clubs:
