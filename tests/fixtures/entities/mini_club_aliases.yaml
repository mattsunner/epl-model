# Small synthetic alias table for isolated club-season membership and curate.py tests --
# deliberately separate from the real production club_aliases.yaml, so these tests don't
# depend on it (or break when a real club gets added/renamed there). fpl_code is set
# for three of the four clubs and left null for Watford, so tests can exercise both the
# football_data and fpl resolution paths, plus a club with no FPL presence.
clubs:
  - club_id: arsenal
    display_name: Arsenal
    football_data_name: Arsenal
    fpl_code: 1
    clubelo_name: null
    understat_name: Arsenal
    transfermarkt_id: null
  - club_id: chelsea
    display_name: Chelsea
    football_data_name: Chelsea
    fpl_code: 2
    clubelo_name: null
    understat_name: Chelsea
    transfermarkt_id: null
  - club_id: leeds
    display_name: Leeds United
    football_data_name: Leeds
    fpl_code: 3
    clubelo_name: null
    understat_name: Leeds
    transfermarkt_id: null
  - club_id: watford
    display_name: Watford
    football_data_name: Watford
    fpl_code: null
    clubelo_name: null
    understat_name: Watford
    transfermarkt_id: null
