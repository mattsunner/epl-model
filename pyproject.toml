[project]
name = "pl-forecast"
version = "0.1.0"
description = "Calibrated season-long forecasts for the Premier League table"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "polars>=1.17",
    "pandera[polars]>=0.21",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "typer>=0.14",
    "httpx>=0.28",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "pyarrow>=18.0",
    "pandas>=2.2",
    "soccerdata>=1.9",
    "penaltyblog>=1.12",
    "numpy>=2.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.122",
    "pre-commit>=4.0",
    "nbstripout>=0.8",
    "ipykernel>=6.29",
    "jupyter>=1.1",
    "plotly>=5.24",
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.2",
    "scipy-stubs>=1.14",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/plforecast"]

[project.scripts]
plforecast = "plforecast.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false

[[tool.mypy.overrides]]
module = "soccerdata.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "penaltyblog.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests that hit live third-party sources (excluded by default)",
]
addopts = "-m 'not network'"
