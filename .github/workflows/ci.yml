name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync (frozen lock file)
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy src/

      # No network in CI: ingest adapters are tested against committed fixtures only.
      # Live-source tests are marked `network` and excluded by pytest's default addopts.
      - name: Test
        run: uv run pytest --cov=plforecast --cov-report=term-missing --cov-fail-under=80

      - name: Validate committed forecast artifacts
        run: uv run plforecast validate-artifacts
