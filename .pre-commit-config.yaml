# Every hook runs the project's own toolchain via `uv run`, so pre-commit, `just check`
# and CI execute the exact tool versions pinned in uv.lock. Remote-mirror hooks were
# dropped because their pinned versions drifted from the lock file.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, markdown]
        require_serial: true
      - id: mypy
        name: mypy (src, strict)
        entry: uv run mypy src/
        language: system
        pass_filenames: false
        files: ^src/
      - id: nbstripout
        name: nbstripout
        entry: uv run nbstripout
        language: system
        types: [jupyter]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
