# Canonical club dimension. Hand-maintained, reviewed at the start of every season when
# promoted clubs enter (design.md section 5.3). One row per club that has ever appeared
# in the Premier League within the pipeline's backfill window (2015/16 onward), not just
# the current season's 20 -- a club relegated out of the FPL API's current roster still
# needs to resolve when it shows up in historical football-data.co.uk rows.
#
# football_data_name is the exact string used in football-data.co.uk's HomeTeam/AwayTeam
# columns. understat_name is Understat's spelling (identical to football-data's for all
# but six clubs). fpl_code is the FPL API's *stable* team code (`teams[].code`), which
# survives promotion and relegation -- unlike `teams[].id`, a 1-20 index re-assigned
# every season; null for clubs not in the current top flight (fill in when they return).
# clubelo_name is ClubElo's own site slug (clubelo.com/{slug}), found by probing the
# site's per-country index pages (design.md 5.1, story C-16) since it has no directory
# API; null for huddersfield, stoke and watford, whose slugs could not be resolved this
# way -- all three have been out of the top flight since before ClubElo's own cached
# coverage window starts, so this costs nothing real (ingest/clubelo.py skips them).
# transfermarkt_id is a placeholder: null until that adapter exists (deferred to v2).
clubs:
